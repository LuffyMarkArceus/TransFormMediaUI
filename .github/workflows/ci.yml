name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Clerk requires NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY during static page
        # generation. The publishable key is a public value (shipped to every
        # browser), so the real one is committed here as a fallback; override
        # it later with a GitHub Actions secret of the same name if desired.
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_bGVhcm5pbmctZGluZ28tOTYuY2xlcmsuYWNjb3VudHMuZGV2JA' }}
        run: npm run build